name: Release Windows Installer

# Push a version tag (e.g. `git tag v0.1.1 && git push origin v0.1.1`) to build the installers
# and publish them to a GitHub Release. A manual run (workflow_dispatch) builds them without
# publishing, so the pipeline can be validated without creating a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write # required to create the release and upload assets

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up .NET (for the payroll sidecar)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Generate application icons
        working-directory: apps/desktop
        # icons/ is gitignored, so regenerate from the committed source before bundling.
        # Without icon.ico the MSI bundling step fails with "Couldn't find a .ico icon".
        run: |
          node src-tauri/generate-icon.mjs
          npx tauri icon src-tauri/app-icon.png

      - name: Build installers
        working-directory: apps/desktop
        # `tauri build` runs beforeBuildCommand (publishes the self-contained .NET sidecar and
        # builds the frontend), compiles the Rust shell in release, and bundles MSI + NSIS.
        run: npm run tauri build

      - name: Show produced artifacts
        working-directory: apps/desktop
        shell: bash
        run: ls -la src-tauri/target/release/bundle/msi src-tauri/target/release/bundle/nsis

      - name: Publish GitHub Release
        # Only when triggered by a version tag; a manual run just proves the build works.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PayrollManager ${{ github.ref_name }}
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Automated Windows build (x64), unsigned.

            **Installers** — pick one:
            - `*_x64-setup.exe` — NSIS installer (simple double-click)
            - `*_x64_en-US.msi` — Windows Installer (managed/enterprise installs)

            Windows 10/11 64-bit. WebView2 installs automatically if missing.

            The installer is **unsigned**, so SmartScreen will warn: *More info → Run anyway*.
            Your data stays local at `%LOCALAPPDATA%\com.payrollmanager.desktop`.

            This is a preview build: the payroll math is correct, but it is not a compliance
            solution (no 941/940/W-2, no multi-state).
          files: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
