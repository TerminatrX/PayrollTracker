[package]
name = "payroll-manager-desktop"
version = "0.1.0"
description = "PayrollManager desktop shell"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[features]
# Enabled by `tauri dev`/`tauri build`; keeps custom-protocol assets working in release.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
